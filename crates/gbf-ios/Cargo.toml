[package]
name = "gbf-ios"
version = "0.5.0"
edition = "2021"
license = "AGPL-3.0-only"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
gbf-core = { path = "../gbf-core", features = ["embedded-ssh"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
fs2 = "0.4"

[build-dependencies]
serde_json = "1"
sha2 = "0.10"
url = "2"
rustls-pemfile = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
tempfile = "3"
