name: Windows build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Check Rust targets
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run isolated core and desktop tests
        run: cargo test --workspace --locked
      - name: Validate PAC rules
        run: npm run test:pac
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Test interface without visual captures
        run: npm run test:ui
      - name: Build native executable
        run: npm run tauri -- build --no-bundle
      - name: Package and verify x64 artifact
        run: python scripts/package-windows.py
      - name: Upload verified CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: GBF-POWER-REBORN-windows-x64
          path: |
            artifacts/windows/*.zip
            artifacts/windows/*.sha256
          if-no-files-found: error
          retention-days: 14
